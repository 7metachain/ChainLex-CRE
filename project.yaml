# ==========================================================================
# CRE PROJECT SETTINGS FILE (root alias)
# ==========================================================================
# The full CRE workflow project lives in ./lexoracle-risk-guard/
# This root-level file mirrors the settings for `cre` CLI convenience.
#
# To simulate:  cd lexoracle-risk-guard && cre workflow simulate risk-oracle --target staging-settings
# To deploy:    cd lexoracle-risk-guard && cre workflow deploy risk-oracle --target production-settings

staging-settings:
  cre-cli:
    don-family: "zone-a"
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

production-settings:
  cre-cli:
    don-family: "zone-a"
  account:
    workflow-owner-address: "0xadB60036FE9d4c269Ed5ca8C5958dd29bc66D814"
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
    - chain-name: ethereum-mainnet
      url: https://ethereum-rpc.publicnode.com
